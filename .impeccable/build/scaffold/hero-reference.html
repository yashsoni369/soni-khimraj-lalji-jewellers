<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: home-a.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300&family=Tagesschrift:wght@400&family=Inria+Serif:wght@700&family=Taviraj:wght@400&family=Karla:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#141917}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:2528px">
  <figure class="r-hero-photo region plate" data-region="hero-photo"><img src="../../../assets/plates/hero-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-header-bar region chrome" data-region="header-bar"><!-- near-black header strip with a hairline bottom edge --></div>
  <div class="r-wordmark region text" data-region="wordmark"><!-- wordmark SONI KHIMRAJ LALJI / JEWELLERS in brass serif caps --><p style="font-size:var(--r-wordmark-font);font-family:var(--r-wordmark-family),sans-serif;font-weight:var(--r-wordmark-weight);line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-nav region text" data-region="nav"><!-- nav links Gold Rate · Bridal · Collections · Old Gold · Our Story · Visit in light grey sans --><p style="font-size:var(--r-nav-font);line-height:1.05;margin:0">nav</p></div>
  <div class="r-phone region text" data-region="phone"><!-- phone number +91 91361 75991 in light grey sans --><p style="font-size:var(--r-phone-font);line-height:1.05;margin:0">phone</p></div>
  <div class="r-wa-icon region control" data-region="wa-icon"><!-- round dark WhatsApp icon button: rebuild the control's chrome from the crop (comp-spec.mjs --crop wa-icon); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-deva-name region text" data-region="deva-name"><!-- shop name in Devanagari सोनी खिमराज लालजी ज्वेलर्स in muted brass --><p style="font-size:var(--r-deva-name-font);font-family:var(--r-deva-name-family),sans-serif;font-weight:var(--r-deva-name-weight);line-height:1.05;margin:0">deva-name</p></div>
  <div class="r-headline-1 region text" data-region="headline-1"><!-- display line 1 'Tested in front of you.' in brass serif --><p style="font-size:var(--r-headline-1-font);font-family:var(--r-headline-1-family),sans-serif;font-weight:var(--r-headline-1-weight);line-height:1.05;margin:0">headline-1</p></div>
  <div class="r-headline-2 region text" data-region="headline-2"><!-- display line 2 'Weighed in front of you.' in white serif --><p style="font-size:var(--r-headline-2-font);font-family:var(--r-headline-2-family),sans-serif;font-weight:var(--r-headline-2-weight);line-height:1.05;margin:0">headline-2</p></div>
  <div class="r-sub region text" data-region="sub"><!-- line 'BIS 916 hallmarked gold · 25+ years on Jivdaya Lane, Ghatkopar West' in grey sans --><p style="font-size:var(--r-sub-font);font-family:var(--r-sub-family),sans-serif;font-weight:var(--r-sub-weight);line-height:1.05;margin:0">sub</p></div>
  <div class="r-cta-whatsapp region control" data-region="cta-whatsapp"><!-- white pill button 'WhatsApp Mr. Soni' with dark text: rebuild the control's chrome from the crop (comp-spec.mjs --crop cta-whatsapp); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-cta-oldgold region text" data-region="cta-oldgold"><!-- brass text link 'Bring your old gold →' --><p style="font-size:var(--r-cta-oldgold-font);line-height:1.05;margin:0">cta-oldgold</p></div>
  <div class="r-rate-label region control" data-region="rate-label"><!-- translucent glass label with hairline border: Today's 22K rate · IBJA 6 Nov · ₹1,31,500 / 10g: rebuild the control's chrome from the crop (comp-spec.mjs --crop rate-label); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
